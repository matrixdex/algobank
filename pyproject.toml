[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "algobank"
version = "0.1.0"
description = "See what changed in a Python package between two versions, and what it can do now."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "baz" }]
dependencies = []
keywords = ["supply chain", "security", "dependencies", "merkle", "pypi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/matrixdex/algobank"
Documentation = "https://github.com/matrixdex/algobank/blob/main/docs/ARCHITECTURE-v0.1.md"

[project.scripts]
algobank = "algobank.diff:main"

[tool.flit.sdist]
include = ["LICENSE", "README.md"]
exclude = ["v0.1", "docs", "CLAUDE.md"]
