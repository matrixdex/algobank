[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "algobank"
version = "1.0.2"
description = "algobank computes changes between two versions of Python packages and what scopes each has"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name="Noorul Ali", email="manonthemoon13131@gmail.com" }]
dependencies = []
keywords = ["supply chain", "cybersecurity", "dependencies", "merkle", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/matrixdex/algobank"
Documentation = "https://matrixdex.github.io/algobank/usage.html"
Website = "https://matrixdex.github.io/algobank/index.html"
Issues = "https://github.com/matrixdex/algobank/issues"

[project.scripts]
algobank = "algobank.diff:main"

[tool.flit.sdist]
include = ["LICENSE", "README.md"]
exclude = ["v0.1", "docs"]
